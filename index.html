<!DOCTYPE html>
<html lang="en">
<head>
    <!--
      Purpose: Render a lightweight, scrollable calendar view with stacked months.
      Exports: None (single-file HTML with inline JS).
      Role: Primary UI entry point for the personal calendar viewer.
      Invariants: Months render in a 3-stack; navigation anchors to month headers.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Kids Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .header {
            margin-bottom: 20px;
        }

        .button {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .button:hover {
            background: #e0e0e0;
        }

        .stack-button {
            width: 100%;
            margin: 12px 0;
            font-size: 15px;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .month-stack {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .month {
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
        }

        .month-header {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #fff;
            padding: 12px 16px;
            font-size: 20px;
            font-weight: 600;
            border-bottom: 1px solid #ddd;
            scroll-margin-top: 8px;
        }

        .calendar {
            border: none;
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #fff;
            border-bottom: 2px solid #ddd;
        }

        .day-name {
            padding: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .day-cell {
            aspect-ratio: 1.3;
            border: 1px solid #ddd;
            padding: 12px;
            font-size: 24px;
            font-weight: 500;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            background: white;
        }

        .day-cell.empty {
            background: #fafafa;
        }

        .day-cell.b-kids {
            background: #5B7FC6;
            color: #000;
        }

        .day-cell.s-kids {
            background: #7EAE5B;
            color: #000;
        }

        .legend {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 30px;
            height: 20px;
            border: 1px solid #ddd;
        }

        .last-updated {
            margin-top: 15px;
            font-size: 13px;
            color: #666;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            .button {
                padding: 10px 14px;
                font-size: 13px;
                touch-action: manipulation;
            }

            .day-name {
                padding: 8px 4px;
                font-size: 12px;
            }

            .day-cell {
                padding: 6px 4px;
                font-size: 18px;
            }

            .legend {
                flex-direction: column;
                gap: 10px;
                font-size: 13px;
            }

            .last-updated {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 20px;
            }

            .day-name {
                font-size: 11px;
            }

            .day-cell {
                padding: 4px 2px;
                font-size: 16px;
            }

            .button {
                padding: 8px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const MONTH_STACK_SIZE = 3;
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                          'July', 'August', 'September', 'October', 'November', 'December'];
        const dayNames = ['Su', 'M', 'T', 'W', 'Th', 'F', 'S'];

        let currentDate = startOfMonth(new Date());
        let events = [];
        let lastUpdated = null;

        function isSameDay(date1, date2) {
            if (!date1 || !date2) return false;
            const d1 = typeof date1 === 'string' ? new Date(date1) : date1;
            const d2 = typeof date2 === 'string' ? new Date(date2) : date2;
            return d1.getDate() === d2.getDate() &&
                   d1.getMonth() === d2.getMonth() &&
                   d1.getFullYear() === d2.getFullYear();
        }

        function getEventType(summary) {
            const lower = summary.toLowerCase();
            // Match anything containing "b kid" (with or without 's')
            if (lower.includes('b kid')) return 's-kids';
            // Match anything containing "s kid" (with or without 's')
            if (lower.includes('s kid')) return 'b-kids';
            return null;
        }

        function formatLastUpdated(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffHours / 24);

            if (diffHours < 1) {
                return 'just now';
            } else if (diffHours < 24) {
                return `${diffHours} hour${diffHours !== 1 ? 's' : ''} ago`;
            } else if (diffDays < 7) {
                return `${diffDays} day${diffDays !== 1 ? 's' : ''} ago`;
            } else {
                return date.toLocaleDateString();
            }
        }

        function startOfMonth(date) {
            return new Date(date.getFullYear(), date.getMonth(), 1);
        }

        function addMonths(date, delta) {
            return new Date(date.getFullYear(), date.getMonth() + delta, 1);
        }

        function getMonthKey(date) {
            const month = String(date.getMonth() + 1).padStart(2, '0');
            return `${date.getFullYear()}-${month}`;
        }

        function getStackStartDate(focusDate) {
            return startOfMonth(focusDate);
        }

        function buildMonthSection(monthDate) {
            const year = monthDate.getFullYear();
            const month = monthDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startingDayOfWeek = firstDay.getDay();
            const daysInMonth = lastDay.getDate();
            const monthKey = getMonthKey(monthDate);

            let html = `
                <section class="month">
                    <div class="month-header" data-month-key="${monthKey}">
                        ${monthNames[month]} ${year}
                    </div>
                    <div class="calendar">
                        <div class="calendar-header">
                            ${dayNames.map((day) => `<div class="day-name">${day}</div>`).join('')}
                        </div>
                        <div class="calendar-grid">
            `;

            // Empty cells before first day
            for (let i = 0; i < startingDayOfWeek; i++) {
                html += '<div class="day-cell empty"></div>';
            }

            // Days of the month
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                let cssClass = 'day-cell';

                // Check for events on this day
                for (const event of events) {
                    if (event.dtstart) {
                        const startDate = typeof event.dtstart === 'string' ? new Date(event.dtstart) : event.dtstart;
                        const endDate = event.dtend ? (typeof event.dtend === 'string' ? new Date(event.dtend) : event.dtend) : startDate;

                        // Check if date falls within event range (inclusive)
                        if (date >= startDate && date <= endDate) {
                            const eventType = getEventType(event.summary);
                            if (eventType) {
                                cssClass += ` ${eventType}`;
                                break; // Only apply first matching event type
                            }
                        }
                    }
                }

                html += `<div class="${cssClass}">${day}</div>`;
            }

            html += `
                        </div>
                    </div>
                </section>
            `;

            return html;
        }

        function scrollToMonthKey(monthKey, behavior = 'auto') {
            const header = document.querySelector(`.month-header[data-month-key="${monthKey}"]`);
            if (!header) return;
            header.scrollIntoView({ behavior, block: 'start' });
        }

        function scrollToPosition(positionY, behavior = 'auto') {
            window.scrollTo({ top: positionY, behavior });
        }

        function scrollToBottom(behavior = 'auto') {
            const bottom = document.documentElement.scrollHeight;
            window.scrollTo({ top: bottom, behavior });
        }

        function renderCalendar({ scrollKey, scrollBehavior = 'auto', scrollPosition, scrollToEnd = false } = {}) {
            const stackStart = getStackStartDate(currentDate);
            const months = Array.from({ length: MONTH_STACK_SIZE }, (_, index) =>
                addMonths(stackStart, index)
            );

            let html = `
                <div class="header">
                </div>
                <h1>Kids Calendar</h1>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #5B7FC6;"></div>
                        <span>with SM</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #7EAE5B;"></div>
                        <span>with BH</span>
                    </div>
                </div>
                <button class="button stack-button" onclick="changeMonth(-1, 'preserve')">↑ Previous month</button>
                <div class="month-stack">
                    ${months.map(buildMonthSection).join('')}
                </div>
                <button class="button stack-button" onclick="changeMonth(1, 'bottom')">↓ Next month</button>
                ${lastUpdated ? `<div class="last-updated">Last updated: ${formatLastUpdated(lastUpdated)}</div>` : ''}
            `;

            document.getElementById('app').innerHTML = html;
            requestAnimationFrame(() => {
                if (scrollToEnd) {
                    scrollToBottom(scrollBehavior);
                    return;
                }
                if (typeof scrollPosition === 'number') {
                    scrollToPosition(scrollPosition, scrollBehavior);
                    return;
                }
                const targetKey = scrollKey || getMonthKey(currentDate);
                scrollToMonthKey(targetKey, scrollBehavior);
            });
        }

        function changeMonth(delta, scrollMode = 'anchor') {
            const currentScroll = window.scrollY;
            currentDate = addMonths(currentDate, delta);
            if (scrollMode === 'preserve') {
                renderCalendar({ scrollBehavior: 'auto', scrollPosition: currentScroll });
                return;
            }
            if (scrollMode === 'bottom') {
                renderCalendar({ scrollBehavior: 'auto', scrollToEnd: true });
                return;
            }
            renderCalendar({ scrollKey: getMonthKey(currentDate), scrollBehavior: 'smooth' });
        }

        function goToToday() {
            currentDate = startOfMonth(new Date());
            renderCalendar({ scrollKey: getMonthKey(currentDate), scrollBehavior: 'smooth' });
        }

        async function loadCalendar() {
            try {
                const response = await fetch('calendar.json');
                if (!response.ok) {
                    throw new Error(`Calendar data not found. The GitHub Action may not have run yet.`);
                }

                const data = await response.json();
                events = data.events || [];
                lastUpdated = data.updated || null;

                renderCalendar();
            } catch (error) {
                document.getElementById('app').innerHTML = `
                    <div class="error">
                        <h2>Error Loading Calendar</h2>
                        <p>${error.message}</p>
                        <p style="margin-top: 10px;">Make sure the GitHub Action has run at least once to generate calendar.json</p>
                    </div>
                `;
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                changeMonth(-1);
            } else if (e.key === 'ArrowRight') {
                changeMonth(1);
            }
        });

        // Initialize
        loadCalendar();
    </script>
</body>
</html>
